<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-label="Peter Banuitt career arc: four chapters from 1997 to now">
<defs><style>.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes draw{0%{stroke-dashoffset:945}55%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{r:8;opacity:.8}50%{r:13;opacity:.18}}.flow{stroke-dasharray:945;animation:draw 9s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style><marker id="nextArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="#2dd4bf"/></marker></defs>
<rect x="1" y="1" width="1278" height="498" rx="18" fill="#0b0f14" stroke="#1f2a37" stroke-width="2"/><text x="40" y="48" class="s" font-size="22" font-weight="700" fill="#e6edf3">The arc</text><text x="142" y="48" class="m" font-size="13" fill="#5f7186">four chapters · one operating habit</text>
<line x1="77" y1="102" x2="1022" y2="102" stroke="#253341" stroke-width="3"/><line x1="77" y1="102" x2="1022" y2="102" stroke="#f5b544" stroke-width="3" class="flow"/><line x1="1036" y1="102" x2="1119" y2="102" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#nextArrow)"/>
<g fill="#0b0f14" stroke="#f5b544" stroke-width="3"><circle cx="77" cy="102" r="7"/><circle cx="392" cy="102" r="7"/><circle cx="707" cy="102" r="7"/></g><circle cx="1022" cy="102" r="13" fill="#2dd4bf" class="pulse"/><circle cx="1022" cy="102" r="7" fill="#0b0f14" stroke="#2dd4bf" stroke-width="3"/>
<g class="m" font-size="13" font-weight="700"><text x="57" y="82" fill="#f5b544">1997</text><text x="372" y="82" fill="#f5b544">2009</text><text x="687" y="82" fill="#f5b544">2023</text><text x="1003" y="82" fill="#2dd4bf">NOW</text></g>
<g transform="translate(36 137)"><rect width="286" height="310" rx="14" fill="#121923" stroke="#1f2a37"/><rect width="286" height="4" rx="2" fill="#f5b544"/><text x="20" y="40" class="m" font-size="12" fill="#f5b544">1997–2009</text><text x="20" y="69" class="s" font-size="18" font-weight="700" fill="#e6edf3">Production automation</text><text x="20" y="91" class="s" font-size="18" font-weight="700" fill="#e6edf3">under constraint</text><text x="20" y="119" class="s" font-size="13" fill="#9fb0c3">White Oak · Siemens · Infineon · Qimonda</text><line x1="20" y1="137" x2="266" y2="137" stroke="#273442"/><text x="20" y="164" class="s" font-size="14" fill="#9fb0c3">Built and operated a fully automated,</text><text x="20" y="185" class="s" font-size="14" fill="#9fb0c3">virtualized 300mm fab data center.</text><text x="20" y="216" class="s" font-size="14" fill="#9fb0c3">Founded the site IT PMO; stayed</text><text x="20" y="237" class="s" font-size="14" fill="#9fb0c3">through the Chapter 11 wind-down.</text><rect x="20" y="263" width="172" height="27" rx="13.5" fill="#292311"/><text x="34" y="281" class="m" font-size="11" fill="#f5b544">DISCIPLINE · FINISH</text></g>
<g transform="translate(350 137)"><rect width="286" height="310" rx="14" fill="#121923" stroke="#1f2a37"/><rect width="286" height="4" rx="2" fill="#f5b544"/><text x="20" y="40" class="m" font-size="12" fill="#f5b544">2009–2023</text><text x="20" y="69" class="s" font-size="18" font-weight="700" fill="#e6edf3">Enterprise technology</text><text x="20" y="91" class="s" font-size="18" font-weight="700" fill="#e6edf3">through five lenses</text><text x="20" y="119" class="s" font-size="13" fill="#9fb0c3">Capital One</text><line x1="20" y1="137" x2="266" y2="137" stroke="#273442"/><text x="20" y="164" class="s" font-size="14" fill="#9fb0c3">Infrastructure · data centers · cyber</text><text x="20" y="185" class="s" font-size="14" fill="#9fb0c3">identity product · agile portfolio</text><text x="20" y="216" class="s" font-size="14" fill="#9fb0c3">Integration, governance, migration,</text><text x="20" y="237" class="s" font-size="14" fill="#9fb0c3">compliance, executive insight.</text><rect x="20" y="263" width="186" height="27" rx="13.5" fill="#292311"/><text x="34" y="281" class="m" font-size="11" fill="#f5b544">DISCIPLINE · INTEGRATE</text></g>
<g transform="translate(664 137)"><rect width="286" height="310" rx="14" fill="#121923" stroke="#1f2a37"/><rect width="286" height="4" rx="2" fill="#f5b544"/><text x="20" y="40" class="m" font-size="12" fill="#f5b544">2023–2024</text><text x="20" y="69" class="s" font-size="18" font-weight="700" fill="#e6edf3">A deliberate break</text><text x="20" y="91" class="s" font-size="18" font-weight="700" fill="#e6edf3">to rebuild the toolkit</text><text x="20" y="119" class="s" font-size="13" fill="#9fb0c3">Full-time · self-directed AI immersion</text><line x1="20" y1="137" x2="266" y2="137" stroke="#273442"/><text x="20" y="164" class="s" font-size="14" fill="#9fb0c3">Built agent systems, governed</text><text x="20" y="185" class="s" font-size="14" fill="#9fb0c3">knowledge, and automated workflows.</text><text x="20" y="216" class="s" font-size="14" fill="#9fb0c3">Earned the PMP</text><text x="20" y="237" class="s" font-size="14" fill="#9fb0c3">in December 2024.</text><rect x="20" y="263" width="171" height="27" rx="13.5" fill="#292311"/><text x="34" y="281" class="m" font-size="11" fill="#f5b544">DISCIPLINE · REBUILD</text></g>
<g transform="translate(978 137)"><rect width="266" height="310" rx="14" fill="#121923" stroke="#28514f"/><rect width="266" height="4" rx="2" fill="#2dd4bf"/><text x="20" y="40" class="m" font-size="12" fill="#2dd4bf">2024–NOW</text><text x="20" y="69" class="s" font-size="18" font-weight="700" fill="#e6edf3">AI-native portfolio</text><text x="20" y="91" class="s" font-size="18" font-weight="700" fill="#e6edf3">leadership</text><text x="20" y="119" class="s" font-size="13" fill="#9fb0c3">TEKsystems Global Services</text><line x1="20" y1="137" x2="246" y2="137" stroke="#273442"/><text x="20" y="164" class="s" font-size="14" fill="#9fb0c3">130 consultants · 30 engagements</text><text x="20" y="185" class="s" font-size="14" fill="#9fb0c3">at a top-10 US bank.</text><text x="20" y="216" class="s" font-size="14" fill="#9fb0c3">Bounded workflows, human review,</text><text x="20" y="237" class="s" font-size="14" fill="#9fb0c3">verifiable outputs.</text><rect x="20" y="263" width="206" height="27" rx="13.5" fill="#102826"/><text x="34" y="281" class="m" font-size="11" fill="#2dd4bf">DISCIPLINE · OPERATIONALIZE</text></g>
</svg>
