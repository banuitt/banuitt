<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="Operating method: capture, compile, bound, prove, govern">
<defs><style>.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes travel{to{stroke-dashoffset:-70}}.loop{animation:travel 8s linear infinite}@media(prefers-reduced-motion:reduce){.loop{animation:none}}</style></defs>
<rect x="1" y="1" width="1278" height="358" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/><text x="40" y="48" class="s" font-size="22" font-weight="700" fill="#1f2328">An evidence-governed operating loop</text><text x="475" y="48" class="m" font-size="13" fill="#57606a">mechanism first · receipt attached</text><line x1="40" y1="68" x2="1240" y2="68" stroke="#d0d7de"/><path d="M145 181H1110" fill="none" stroke="#b8c2cc" stroke-width="2" stroke-dasharray="6 10" class="loop"/>
<g class="s"><g transform="translate(38 98)"><rect width="224" height="172" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><text x="18" y="31" class="m" font-size="11" fill="#b7791f">01 / EVIDENCE IN</text><text x="18" y="61" font-size="18" font-weight="700" fill="#1f2328">CAPTURE</text><text x="18" y="91" font-size="14" fill="#57606a">Preserve source evidence</text><text x="18" y="112" font-size="14" fill="#57606a">and its provenance.</text><circle cx="112" cy="152" r="6" fill="#b7791f"/></g><g transform="translate(283 98)"><rect width="224" height="172" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><text x="18" y="31" class="m" font-size="11" fill="#b7791f">02 / STRUCTURE</text><text x="18" y="61" font-size="18" font-weight="700" fill="#1f2328">COMPILE</text><text x="18" y="91" font-size="14" fill="#57606a">Distill into durable pages,</text><text x="18" y="112" font-size="14" fill="#57606a">not transcript piles.</text><circle cx="112" cy="152" r="6" fill="#b7791f"/></g><g transform="translate(528 98)"><rect width="224" height="172" rx="14" fill="#f6f8fa" stroke="#9fd4cf"/><text x="18" y="31" class="m" font-size="11" fill="#0f766e">03 / CONSTRAIN</text><text x="18" y="61" font-size="18" font-weight="700" fill="#1f2328">BOUND</text><text x="18" y="91" font-size="14" fill="#57606a">Retrieve the smallest relevant</text><text x="18" y="112" font-size="14" fill="#57606a">set; make review explicit.</text><circle cx="112" cy="152" r="6" fill="#0f766e"/></g><g transform="translate(773 98)"><rect width="224" height="172" rx="14" fill="#f6f8fa" stroke="#a9d7b6"/><text x="18" y="31" class="m" font-size="11" fill="#1a7f37">04 / TEST REALITY</text><text x="18" y="61" font-size="18" font-weight="700" fill="#1f2328">PROVE</text><text x="18" y="91" font-size="14" fill="#57606a">Run adversarial probes and</text><text x="18" y="112" font-size="14" fill="#57606a">mutation-test each fix.</text><circle cx="112" cy="152" r="6" fill="#1a7f37"/></g><g transform="translate(1018 98)"><rect width="224" height="172" rx="14" fill="#f6f8fa" stroke="#9fd4cf"/><text x="18" y="31" class="m" font-size="11" fill="#0f766e">05 / DURABLE CHANGE</text><text x="18" y="61" font-size="18" font-weight="700" fill="#1f2328">GOVERN</text><text x="18" y="91" font-size="14" fill="#57606a">Record decisions, changes,</text><text x="18" y="112" font-size="14" fill="#57606a">and permanent regressions.</text><circle cx="112" cy="152" r="6" fill="#0f766e"/></g></g>
<path d="M1130 275v20H150v-20" fill="none" stroke="#b8c2cc" stroke-width="1.5" stroke-dasharray="5 8"/><text x="640" y="327" text-anchor="middle" class="m" font-size="13" fill="#57606a">A created file, a generated report, or a green suite is not proof the outcome works.</text>
</svg>
