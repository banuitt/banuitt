<path d="M42 55h28" stroke="#f5b544" stroke-width="3"/><text x="82" y="60" class="mono" font-size="14" letter-spacing="2.1" fill="#9fb0c3">PRODUCTION OPERATING DISCIPLINE · SINCE 1997</text>
<text x="42" y="127" class="sans" font-size="57" font-weight="800" letter-spacing="1" fill="url(#name)">PETER BANUITT</text>
<path d="M42 146h640" stroke="#273747"/><path d="M42 146h175" stroke="#f5b544" stroke-width="2"/>
<text x="42" y="182" class="sans" font-size="25" font-weight="650" fill="#e6edf3">Nearly three decades of production operating discipline.</text>
<text x="42" y="212" class="sans" font-size="25" font-weight="650" fill="#2dd4bf">Now pointed at AI.</text>
<text x="42" y="243" class="sans" font-size="14" fill="#9fb0c3">Engagement Manager · TEKsystems Global Services · PMP · Lean Six Sigma Black Belt</text>
<g class="mono" font-size="13">
  <rect x="42" y="266" width="4" height="16" rx="2" fill="#f5b544"/><text x="59" y="279" font-weight="700" fill="#f5b544">FAB</text><text x="107" y="279" fill="#9fb0c3">production automation under constraint</text>
  <rect x="42" y="290" width="4" height="16" rx="2" fill="#f5b544"/><text x="59" y="303" font-weight="700" fill="#f5b544">BANK</text><text x="107" y="303" fill="#9fb0c3">five enterprise operating lenses</text>
  <rect x="42" y="314" width="4" height="16" rx="2" fill="#2dd4bf"/><text x="59" y="327" font-weight="700" fill="#2dd4bf">AI</text><text x="107" y="327" fill="#9fb0c3">bounded workflows · explicit human review</text>
</g>
<rect x="42" y="347" width="494" height="29" rx="7" fill="#0a0e13" stroke="#1f2a37"/><text x="56" y="366" class="mono" font-size="12.5" fill="#5f7186">$ peter --status</text><text x="185" y="366" class="mono" font-size="12.5" fill="#4ade80">instrument → verify → govern</text><rect class="cursor" x="420" y="355" width="7" height="13" fill="#4ade80"/>

