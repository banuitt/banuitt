<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="Peter Banuitt: production operating discipline since 1997, now pointed at AI, illustrated by a semiconductor wafer resolving into a connected node graph">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b0f14"/><stop offset="1" stop-color="#0f141b"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop stop-color="#e6edf3"/><stop offset=".56" stop-color="#f5b544"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <radialGradient id="amberGlow"><stop stop-color="#f5b544" stop-opacity=".08"/><stop offset="1" stop-color="#f5b544" stop-opacity="0"/></radialGradient>
  <radialGradient id="tealGlow"><stop stop-color="#2dd4bf" stop-opacity=".14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <radialGradient id="mirror" cx="38%" cy="30%"><stop stop-color="#263741"/><stop offset=".35" stop-color="#14242d"/><stop offset=".76" stop-color="#091319"/><stop offset="1" stop-color="#04090d"/></radialGradient>
  <linearGradient id="filmSheen" gradientUnits="userSpaceOnUse" x1="910" y1="76" x2="1208" y2="324">
    <stop stop-color="#8b5cf6"/><stop offset=".31" stop-color="#2dd4bf"/><stop offset=".67" stop-color="#f5b544"/><stop offset="1" stop-color="#4ade80"/>
    <animateTransform class="filmMotion" attributeName="gradientTransform" type="rotate" values="0 1060 200;360 1060 200" dur="20s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="edgeLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2fbff"/><stop offset=".38" stop-color="#96fff1"/><stop offset=".7" stop-color="#f5b544"/><stop offset="1" stop-color="#718493"/></linearGradient>
  <radialGradient id="edgeShade"><stop offset=".62" stop-color="#061016" stop-opacity="0"/><stop offset=".9" stop-color="#061016" stop-opacity=".2"/><stop offset="1" stop-color="#020609" stop-opacity=".78"/></radialGradient>
  <pattern id="atmosGrid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8aa0b4" stroke-opacity=".04"/></pattern>
  <pattern id="dieGrid" width="19" height="19" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="17" height="17" rx="2" fill="#0b161d" fill-opacity=".9" stroke="#7b929f" stroke-opacity=".28" stroke-width=".65"/></pattern>
  <clipPath id="waferClip"><path d="M1060 50a150 150 0 1 0 0 300 150 150 0 0 0 0-300Zm-13 297 13-10 13 10Z" fill-rule="evenodd"/></clipPath>
  <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter>
  <filter id="nodeGlow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="dieGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .wave{fill:#09141a;stroke:#708895;stroke-opacity:.12;stroke-width:.6;opacity:.08;filter:url(#dieGlow);animation:dieWave 9s linear infinite;animation-delay:calc(var(--delay) - 7.2s)}.film{mix-blend-mode:screen}.staticFrame{display:none;filter:url(#dieGlow)}.tracePulse{fill:none;stroke:#dffefa;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:2 118;animation:pulseRoute 5.8s linear infinite}.cursor{animation:blink 1.1s steps(1) infinite}.node{fill:#2dd4bf;filter:url(#nodeGlow)}
    @keyframes dieWave{0%,8%,100%{fill:#09141a;stroke:#708895;stroke-opacity:.12;opacity:.08}11%,24%{fill:#f5b544;stroke:#ffd98f;stroke-opacity:.74;opacity:1}31%,46%{fill:#2dd4bf;stroke:#5eead4;stroke-opacity:.3;opacity:.35}63%,99%{fill:#09141a;stroke:#708895;stroke-opacity:.12;opacity:.08}}
    @keyframes pulseRoute{to{stroke-dashoffset:-120}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.wave,.tracePulse,.cursor{animation:none}.filmMotion{display:none}.wave{fill:#09141a;stroke:#708895;stroke-opacity:.12;opacity:.08}.staticFrame{display:inline}.tracePulse{opacity:.72}}
  </style>
</defs>
