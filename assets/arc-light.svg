<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-label="Peter Banuitt career arc: four chapters from 1997 to now">
<defs><style>.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes draw{0%{stroke-dashoffset:945}55%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{r:8;opacity:.8}50%{r:13;opacity:.18}}.flow{stroke-dasharray:945;animation:draw 9s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style><marker id="nextArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="#0f766e"/></marker></defs>
<rect x="1" y="1" width="1278" height="498" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/><text x="40" y="48" class="s" font-size="22" font-weight="700" fill="#1f2328">The arc</text><text x="142" y="48" class="m" font-size="13" fill="#57606a">four chapters · one operating habit</text>
<line x1="77" y1="102" x2="1022" y2="102" stroke="#d8dee4" stroke-width="3"/><line x1="77" y1="102" x2="1022" y2="102" stroke="#b7791f" stroke-width="3" class="flow"/><line x1="1036" y1="102" x2="1119" y2="102" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#nextArrow)"/><g fill="#fff" stroke="#b7791f" stroke-width="3"><circle cx="77" cy="102" r="7"/><circle cx="392" cy="102" r="7"/><circle cx="707" cy="102" r="7"/></g><circle cx="1022" cy="102" r="13" fill="#0f766e" class="pulse"/><circle cx="1022" cy="102" r="7" fill="#fff" stroke="#0f766e" stroke-width="3"/><g class="m" font-size="13" font-weight="700"><text x="57" y="82" fill="#b7791f">1997</text><text x="372" y="82" fill="#b7791f">2009</text><text x="687" y="82" fill="#b7791f">2023</text><text x="1003" y="82" fill="#0f766e">NOW</text></g>
<g class="s"><g transform="translate(36 137)"><rect width="286" height="310" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect width="286" height="4" rx="2" fill="#b7791f"/><text x="20" y="40" class="m" font-size="12" fill="#b7791f">1997–2009</text><text x="20" y="69" font-size="18" font-weight="700" fill="#1f2328">Production automation</text><text x="20" y="91" font-size="18" font-weight="700" fill="#1f2328">under constraint</text><text x="20" y="119" font-size="13" fill="#57606a">White Oak · Siemens · Infineon · Qimonda</text><line x1="20" y1="137" x2="266" y2="137" stroke="#d8dee4"/><text x="20" y="164" font-size="14" fill="#57606a">Built and operated a fully automated,</text><text x="20" y="185" font-size="14" fill="#57606a">virtualized 300mm fab data center.</text><text x="20" y="216" font-size="14" fill="#57606a">Founded the site IT PMO; stayed</text><text x="20" y="237" font-size="14" fill="#57606a">through the Chapter 11 wind-down.</text><rect x="20" y="263" width="172" height="27" rx="13.5" fill="#f7e8ca"/><text x="34" y="281" class="m" font-size="11" fill="#8a5617">DISCIPLINE · FINISH</text></g>
<g transform="translate(350 137)"><rect width="286" height="310" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect width="286" height="4" rx="2" fill="#b7791f"/><text x="20" y="40" class="m" font-size="12" fill="#b7791f">2009–2023</text><text x="20" y="69" font-size="18" font-weight="700" fill="#1f2328">Enterprise technology</text><text x="20" y="91" font-size="18" font-weight="700" fill="#1f2328">through five lenses</text><text x="20" y="119" font-size="13" fill="#57606a">Capital One</text><line x1="20" y1="137" x2="266" y2="137" stroke="#d8dee4"/><text x="20" y="164" font-size="14" fill="#57606a">Infrastructure · data centers · cyber</text><text x="20" y="185" font-size="14" fill="#57606a">identity product · agile portfolio</text><text x="20" y="216" font-size="14" fill="#57606a">Integration, governance, migration,</text><text x="20" y="237" font-size="14" fill="#57606a">compliance, executive insight.</text><rect x="20" y="263" width="186" height="27" rx="13.5" fill="#f7e8ca"/><text x="34" y="281" class="m" font-size="11" fill="#8a5617">DISCIPLINE · INTEGRATE</text></g>
<g transform="translate(664 137)"><rect width="286" height="310" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect width="286" height="4" rx="2" fill="#b7791f"/><text x="20" y="40" class="m" font-size="12" fill="#b7791f">2023–2024</text><text x="20" y="69" font-size="18" font-weight="700" fill="#1f2328">A deliberate break</text><text x="20" y="91" font-size="18" font-weight="700" fill="#1f2328">to rebuild the toolkit</text><text x="20" y="119" font-size="13" fill="#57606a">Full-time · self-directed AI immersion</text><line x1="20" y1="137" x2="266" y2="137" stroke="#d8dee4"/><text x="20" y="164" font-size="14" fill="#57606a">Built agent systems, governed</text><text x="20" y="185" font-size="14" fill="#57606a">knowledge, and automated workflows.</text><text x="20" y="216" font-size="14" fill="#57606a">Earned the PMP</text><text x="20" y="237" font-size="14" fill="#57606a">in December 2024.</text><rect x="20" y="263" width="171" height="27" rx="13.5" fill="#f7e8ca"/><text x="34" y="281" class="m" font-size="11" fill="#8a5617">DISCIPLINE · REBUILD</text></g>
<g transform="translate(978 137)"><rect width="266" height="310" rx="14" fill="#f6f8fa" stroke="#9fd4cf"/><rect width="266" height="4" rx="2" fill="#0f766e"/><text x="20" y="40" class="m" font-size="12" fill="#0f766e">2024–NOW</text><text x="20" y="69" font-size="18" font-weight="700" fill="#1f2328">AI-native portfolio</text><text x="20" y="91" font-size="18" font-weight="700" fill="#1f2328">leadership</text><text x="20" y="119" font-size="13" fill="#57606a">TEKsystems Global Services</text><line x1="20" y1="137" x2="246" y2="137" stroke="#d8dee4"/><text x="20" y="164" font-size="14" fill="#57606a">130 consultants · 30 engagements</text><text x="20" y="185" font-size="14" fill="#57606a">at a top-10 US bank.</text><text x="20" y="216" font-size="14" fill="#57606a">Bounded workflows, human review,</text><text x="20" y="237" font-size="14" fill="#57606a">verifiable outputs.</text><rect x="20" y="263" width="206" height="27" rx="13.5" fill="#d9f2ef"/><text x="34" y="281" class="m" font-size="11" fill="#0f766e">DISCIPLINE · OPERATIONALIZE</text></g></g>
</svg>
